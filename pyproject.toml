[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "make-sample-ls11"
version = "0.1.1"
description = "Legacy Surveys DR11 BGS-like magnitude- and volume-limited galaxy samples and randoms"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Johan Comparat", email = "johan.comparat@pm.me" }]
dependencies = ["numpy", "scipy", "astropy", "fitsio", "healpy", "pyyaml"]

[project.urls]
Homepage = "https://github.com/JohanComparat/make-sample-ls11"
Documentation = "https://make-sample-ls11.readthedocs.io"

[project.optional-dependencies]
sed = ["kcorrect>=5.1", "lephare>=1.0", "dsps", "eazy", "pcigale"]
test = ["pytest", "pytest-cov", "kcorrect>=5.1", "matplotlib", "configobj"]
docs = ["sphinx", "furo", "myst-parser", "sphinx-copybutton"]

[tool.setuptools.packages.find]
include = ["ls11samples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["ls11samples", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
